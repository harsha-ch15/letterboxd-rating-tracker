
name: Weekly Letterboxd Movie Report

on:
  schedule:
    - cron: "0 7 * * 1"
      timezone: "America/Chicago"

  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and send weekly report
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
          MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
          MAILJET_SENDER_EMAIL: ${{ secrets.MAILJET_SENDER_EMAIL }}
          MAILJET_RECIPIENTS: ${{ secrets.MAILJET_RECIPIENTS }}
        run: python email_runner.py
